name: Build and test package

on:
  workflow_call:
    inputs:
      package:
        description: >
          Package to build and test. Space-separated list for a repository that
          holds more than one package.
        type: string
        required: true
      shared-workflows-ref:
        description: >
          Ref this workflow was called at, so its scripts are checked out from
          the same commit. Set it to the ref after the @ in the uses: line. The
          job fails when the two disagree.
        type: string
        required: true
      container-image:
        description: Container image holding the ROS 2 build environment
        type: string
        required: false
        default: ghcr.io/launchpad-build/launchpad-ros2-jazzy:main
      base-paths:
        description: >
          Paths colcon crawls for packages. Space-separated list. Override it
          when the repository has a package.xml at its root, because colcon
          stops descending at a package.
        type: string
        required: false
        default: src
      registry:
        description: Registry logged into before the image is pulled
        type: string
        required: false
        default: ghcr.io
      ros-distro:
        description: ROS 2 distribution sourced before the build
        type: string
        required: false
        default: jazzy
      install-dependencies:
        description: >
          Run rosdep install over the crawled packages before building, so a
          declared dependency the image does not carry is installed rather than
          failing the build.
        type: boolean
        required: false
        default: true
      colcon-build-args:
        description: Extra arguments appended to colcon build
        type: string
        required: false
        default: ""
      colcon-test-args:
        description: Extra arguments appended to colcon test
        type: string
        required: false
        default: ""
    secrets:
      ghcr-token:
        description: >
          Token used to pull the image from a private registry. Leave it unset
          for a public image and the job pulls without logging in.
        required: false

permissions:
  contents: read

# The group carries the caller workflow name, so two caller workflows in one
# repository do not cancel each other on the same ref.
concurrency:
  group: build-and-test-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ inputs.container-image }}
      PACKAGES: ${{ inputs.package }}
      ROS_DISTRO: ${{ inputs.ros-distro }}
      BASE_PATHS: ${{ inputs.base-paths }}
      REGISTRY_TOKEN: ${{ secrets.ghcr-token }}
      WORKER: ros-build-and-test
      SCRIPTS: ${{ github.workspace }}/.shared-workflows/scripts/build-and-test
      CALLER_PATH: src/repo
      WORKFLOW_PATH: launchpad-build/shared-workflows/.github/workflows/build-and-test.yml
      SCRIPTS_REF: ${{ inputs.shared-workflows-ref }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: src/repo

      # A reusable workflow does not get its own repository on disk, so the
      # scripts it runs are checked out here.
      - name: Check out the workflow scripts
        uses: actions/checkout@v4
        with:
          repository: launchpad-build/shared-workflows
          ref: ${{ inputs.shared-workflows-ref }}
          path: .shared-workflows
          persist-credentials: false

      - name: Confirm the scripts match the caller
        run: "$SCRIPTS/verify-scripts-ref.sh"

      - name: Log in to the container registry
        if: env.REGISTRY_TOKEN != ''
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ github.actor }}
        run: "$SCRIPTS/registry-login.sh"

      - name: Pull the container image
        run: "$SCRIPTS/pull-image.sh"

      - name: Start the build container
        run: "$SCRIPTS/start-container.sh"

      - name: Install the declared dependencies
        if: inputs.install-dependencies
        run: "$SCRIPTS/install-dependencies.sh"

      - name: Build the package
        id: build
        env:
          BUILD_ARGS: ${{ inputs.colcon-build-args }}
        run: "$SCRIPTS/build-packages.sh"

      - name: Confirm every selected package built
        run: "$SCRIPTS/check-build-directories.sh"

      - name: Test the package
        id: test
        env:
          TEST_ARGS: ${{ inputs.colcon-test-args }}
        run: "$SCRIPTS/run-tests.sh"

      - name: Summarise the test results
        if: always()
        env:
          TEST_RC: ${{ steps.test.outputs.rc }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: "$SCRIPTS/summarise-results.sh"

      - name: Stop the build container
        if: always()
        run: "$SCRIPTS/stop-container.sh"
