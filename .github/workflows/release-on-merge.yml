name: Release version on merge to main

on:
  workflow_call:
    inputs:
      version-source:
        description: >
          How to read and write the version number.
          Supported values: package-xml, package-json, pyproject-toml.
        type: string
        required: false
        default: package-xml
      python-version:
        description: Python version used to run towncrier
        type: string
        required: false
        default: "3.12"
      fragment-directory:
        description: Directory containing news fragments
        type: string
        required: false
        default: newsfragments
      stamp-script:
        description: >
          Script run with the new version as its only argument after the
          manifest is bumped and before the release commit, so anything it
          rewrites lands in the tagged commit. Skipped when the path is absent.
        type: string
        required: false
        default: .github/version-stamp.sh

permissions:
  contents: write

# Serialise releases per repository and branch. Concurrent runs would race on
# the version bump and the push to main, producing duplicate tags or rejected
# pushes. Queue runs instead of cancelling so no release is interrupted mid-push.
concurrency:
  group: release-on-merge-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Detect ───────────────────────────────────────────────────────
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      fragment: ${{ steps.detect.outputs.fragment }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Determine the version bump level from news fragments
        id: detect
        run: |
          subject=$(git log -1 --pretty=%s)
          if [[ "$subject" =~ ^Release\ [0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release commit detected. Nothing to release."
            exit 0
          fi

          frag_dir="${{ inputs.fragment-directory }}"

          shopt -s nullglob
          fragments=(
            "$frag_dir"/*.breaking "$frag_dir"/*.breaking.md
            "$frag_dir"/*.feature  "$frag_dir"/*.feature.md
            "$frag_dir"/*.fix      "$frag_dir"/*.fix.md
          )
          shopt -u nullglob

          if [ ${#fragments[@]} -eq 0 ]; then
            echo "No news fragments found. Nothing to release."
            exit 0
          fi

          fragment="bug"
          for f in "${fragments[@]}"; do
            name=${f%.md}
            case "${name##*.}" in
              breaking) fragment="major"; break ;;
              feature) [ "$fragment" = "bug" ] && fragment="feature" ;;
            esac
          done
          echo "fragment=$fragment" >> "$GITHUB_OUTPUT"

  # ── Release ──────────────────────────────────────────────────────
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.fragment != ''
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.LP_VERSION_BUMPER_ID }}
          private-key: ${{ secrets.LP_VERSION_BUMPER_SECRET }}

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Configure git identity for the release commit
        uses: fregante/setup-git-user@v2

      - name: Install towncrier
        run: pip install towncrier

      - name: Build and publish the release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          frag_dir="${{ inputs.fragment-directory }}"
          source="${{ inputs.version-source }}"
          stamp_script="${{ inputs.stamp-script }}"

          # main can advance while this run is in flight. Rebasing a release
          # commit built against a stale tree silently carries forward any
          # fragment a concurrent merge added, leaving it unreleased. Instead
          # rebuild the whole release from the refreshed main on every attempt,
          # then push branch and tag atomically.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            shopt -s nullglob
            fragments=(
              "$frag_dir"/*.breaking "$frag_dir"/*.breaking.md
              "$frag_dir"/*.feature  "$frag_dir"/*.feature.md
              "$frag_dir"/*.fix      "$frag_dir"/*.fix.md
            )
            shopt -u nullglob
            if [ ${#fragments[@]} -eq 0 ]; then
              echo "No news fragments remain on main; a concurrent release already consumed them."
              exit 0
            fi

            level="bug"
            for f in "${fragments[@]}"; do
              name=${f%.md}
              case "${name##*.}" in
                breaking) level="major"; break ;;
                feature) if [ "$level" = "bug" ]; then level="feature"; fi ;;
              esac
            done

            case "$source" in
              package-xml)
                current=$(find . -name package.xml -type f -exec \
                  sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' {} + | sort -V | tail -1) ;;
              package-json)
                current=$(find . -name package.json -not -path '*/node_modules/*' -type f -exec \
                  python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" {} \; | sort -V | tail -1) ;;
              pyproject-toml)
                current=$(find . -name pyproject.toml -type f -print0 | 
                  xargs -0 -n1 python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb')).get('project',dict()).get('version',''))" | sort -V | tail -1) ;;
              *)
                echo "::error::Unknown version-source '$source'"
                exit 1 ;;
            esac

            IFS=. read -r major minor patch <<< "$current"
            case "$level" in
              major)   major=$((major + 1)); minor=0; patch=0 ;;
              feature) minor=$((minor + 1)); patch=0 ;;
              bug)     patch=$((patch + 1)) ;;
            esac
            next="${major}.${minor}.${patch}"
            echo "Releasing ${next} (${level} bump from ${current}) on attempt ${attempt}."

            towncrier build --version "$next" --yes

            case "$source" in
              package-xml)
                find . -name package.xml -type f -exec \
                  sed -i "s|<version>.*</version>|<version>${next}</version>|" {} + ;;
              package-json)
                find . -name package.json -not -path '*/node_modules/*' -type f -exec \
                  python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['version']=sys.argv[2]; open(p,'w').write(json.dumps(d, indent=2))" {} "$next" \; ;;
              pyproject-toml)
                find . -name pyproject.toml -type f -exec \
                  sed -i "s|^version = \".*\"|version = \"${next}\"|" {} + ;;
            esac

            # Inside the loop because the reset above discards what a previous
            # attempt wrote. Run through bash so a missing execute bit is not a
            # failure, and without the app token so the script cannot push.
            if [ -f "$stamp_script" ]; then
              echo "Stamping ${next} via ${stamp_script}."
              env -u GITHUB_TOKEN bash "$stamp_script" "$next"
            fi

            git add --all
            git commit -m "Release ${next}"
            git tag "${next}"

            if git push --atomic origin main "${next}"; then
              echo "Released ${next}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; main advanced. Recomputing from the refreshed main."
            git tag -d "${next}" || true
          done

          echo "::error::Failed to push the release after 3 attempts."
          exit 1
