name: Probe empty container credentials

on:
  push:
    branches: [probe/DP-163-container-job]

permissions:
  contents: read

jobs:
  empty-password:
    name: Container credentials resolving to an empty string
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - name: Report the container
        run: cat /etc/os-release
