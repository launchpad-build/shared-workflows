name: Probe public ros images on ghcr

on:
  push:
    branches: [probe/DP-163-container-job]

permissions:
  contents: read

jobs:
  anonymous-pull:
    name: Which public ros images ghcr serves
    runs-on: ubuntu-latest
    steps:
      - name: Try each candidate
        run: |
          for image in \
            ghcr.io/ros-controls/ros:jazzy-ros-base \
            ghcr.io/sloretz/ros:jazzy-ros-base \
            ghcr.io/tiryoh/ros2-desktop-vnc:jazzy \
            ghcr.io/ros/ros:jazzy-ros-base \
            ghcr.io/ros-industrial/ros:jazzy-ros-base; do
            if docker pull -q "$image" >/dev/null 2>&1; then
              echo "pull ok: $image"
            else
              echo "pull failed: $image"
            fi
          done
