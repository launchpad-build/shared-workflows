name: Probe the secrets context in a step if

on:
  push:
    branches: [probe/DP-163-container-job]

permissions:
  contents: read

jobs:
  secrets-in-step-if:
    name: A step if reading the secrets context
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Runs only when the secret is empty
        if: secrets.GHCR_READ_TOKEN == ''
        run: echo "the secrets context gate fired"
