name: Probe container credentials

on:
  push:
    branches: [probe/DP-163-container-job]

permissions:
  contents: read
  packages: read

jobs:
  dockerhub-with-creds:
    name: Docker Hub image with a github.token fallback
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ros:jazzy-ros-base
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ_TOKEN || github.token }}
    steps:
      - name: Report the container
        run: cat /etc/os-release

  dockerhub-no-creds:
    name: Docker Hub image with no credentials
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ros:jazzy-ros-base
    steps:
      - name: Report the container
        run: cat /etc/os-release

  ghcr-public-with-creds:
    name: Public ghcr image with a github.token fallback
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/actions/actions-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ_TOKEN || github.token }}
    steps:
      - name: Report the container
        run: cat /etc/os-release

  ghcr-private-with-github-token:
    name: Private ghcr image with the job token
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/launchpad-build/launchpad-ros2-jazzy:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ_TOKEN || github.token }}
    steps:
      - name: Report the container
        run: cat /etc/os-release

  step-if-forms:
    name: Which empty-secret gate actually fires
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN != '' }}
    steps:
      - name: Runs when the secrets context is readable in a step if
        if: secrets.GHCR_READ_TOKEN == ''
        run: echo "secrets context gate fired"

      - name: Runs when the job env boolean is readable
        if: env.HAS_REGISTRY_TOKEN == 'false'
        run: echo "job env gate fired"

      - name: Report the env value
        run: echo "HAS_REGISTRY_TOKEN=$HAS_REGISTRY_TOKEN"
